name: Verify

# Runs on every push / PR so tenancy leaks, type errors, lint errors and broken
# tests are caught before Vercel deploys them. No secrets needed: tests mock
# Supabase and the build uses placeholder env values.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Org-scope check, lint, typecheck, unit tests
        run: npm run verify

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXTAUTH_SECRET: ci-only-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: '1'
